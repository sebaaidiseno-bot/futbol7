<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilsen FC · Formaciones</title>
<meta name="description" content="Arma la formación de Pilsen FC (fútbol 7 u 11) y descarga la imagen lista para compartir.">
<meta name="theme-color" content="#f6f7f4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.2l4 2.9-1.5 4.7h-5L8 10.1z"/><path d="M12 7.2V2.8M16 10.1l4.2-1.4M14.5 14.8l2.6 3.7M9.5 14.8l-2.6 3.7M8 10.1L3.8 8.7"/></svg>
    <span>Pilsen <b>FC</b></span>
  </div>
</header>

<div class="layout">
  <div class="controls">

    <section class="card">
      <h2><span class="step">1</span>Partido</h2>
      <div class="mode" id="mode" role="group" aria-label="Modalidad">
        <button type="button" data-mode="7">Fútbol 7</button>
        <button type="button" data-mode="11">Fútbol 11</button>
      </div>
      <label class="field">
        <span>Cancha</span>
        <input id="info-venue" type="text" maxlength="40" placeholder="Ej: Canchas Pilsen · Cancha 3">
      </label>
      <div class="row">
        <label class="field">
          <span>Horario</span>
          <input id="info-time" type="text" maxlength="30" placeholder="Jueves 21:00">
        </label>
        <label class="field">
          <span>Valor por jugador</span>
          <div class="money"><i>$</i><input id="info-price" type="text" inputmode="numeric" maxlength="9" placeholder="5000"></div>
        </label>
      </div>
    </section>

    <section class="card team" id="team-a">
      <h2><span class="step">2</span>Equipo 1</h2>
      <input class="team-name" data-team="a" value="Rojo" maxlength="18" aria-label="Nombre equipo 1">
      <div class="sub">Color de camiseta</div>
      <div class="colors" data-team="a"></div>
      <div class="sub">Formación</div>
      <div class="formations" data-team="a"></div>
      <label class="field">
        <span>Jugadores <em>· uno por línea, el primero es el arquero</em></span>
        <textarea id="names-a" data-team="a" rows="7" placeholder="Arquero&#10;Defensa 1&#10;Defensa 2&#10;..."></textarea>
      </label>
      <div class="count" id="count-a"></div>
    </section>

    <section class="card team" id="team-b">
      <h2><span class="step">3</span>Equipo 2</h2>
      <input class="team-name" data-team="b" value="Blanco" maxlength="18" aria-label="Nombre equipo 2">
      <div class="sub">Color de camiseta</div>
      <div class="colors" data-team="b"></div>
      <div class="sub">Formación</div>
      <div class="formations" data-team="b"></div>
      <label class="field">
        <span>Jugadores <em>· uno por línea, el primero es el arquero</em></span>
        <textarea id="names-b" data-team="b" rows="7" placeholder="Arquero&#10;Defensa 1&#10;Defensa 2&#10;..."></textarea>
      </label>
      <div class="count" id="count-b"></div>
    </section>

    <section class="card">
      <h2><span class="step">4</span>Transferencia</h2>
      <label class="field">
        <span>Cuenta <em>· una línea por dato, se guarda para la próxima vez</em></span>
        <textarea id="info-account" rows="4" placeholder="Nombre Apellido&#10;RUT 12.345.678-9&#10;Banco · Cuenta Vista 123456789&#10;correo@ejemplo.cl"></textarea>
      </label>
      <label class="switch"><input type="checkbox" id="info-show-account"><i></i><span>Mostrar la cuenta en la imagen</span></label>
    </section>

    <div class="tools">
      <button id="shuffle" type="button" class="ghost">Mezclar equipos</button>
      <button id="clear" type="button" class="ghost">Limpiar nombres</button>
    </div>
  </div>

  <aside class="preview">
    <canvas id="pitch" width="1080" height="1600"></canvas>
    <div class="cta">
      <button id="download" type="button" class="primary">Descargar imagen</button>
      <button id="share" type="button" class="primary alt" hidden>Compartir</button>
    </div>
  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
